      /* =========================================
   🌟 SIGNUP PAGE STYLING (COMPUTER SKILLS BG) 🌟
   ========================================= */

:root {
    --bg-color: #0a0e17; 
    --card-bg: rgba(26, 32, 53, 0.85); 
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent: #00f2fe;   
    --accent2: #4facfe;  
    --gradient: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
    --shadow-card: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
    --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* --- Body with Background Image & Dark Overlay --- */
body {
    background-image: linear-gradient(rgba(10, 14, 23, 0.85), rgba(10, 14, 23, 0.85)), 
                      url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1920&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* --- Signup Form Card Wrapper (Agar aapne HTML mein div nahi banaya toh body par elements center honge) --- */
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* --- Inputs, Select & File Upload Styling --- */
input[type="email"],
input[type="text"],
input[type="file"],
select {
    width: 100%;
    max-width: 400px;
    background-color: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: var(--text-main) !important;
    border-radius: 12px !important;
    padding: 14px 20px !important;
    margin-bottom: 18px;
    font-size: 14px;
    backdrop-filter: blur(10px);
    transition: var(--transition);
}

/* File Upload Specific Customization */
input[type="file"] {
    padding: 10px 15px !important;
    cursor: pointer;
}

input[type="file"]::file-selector-button {
    background: var(--gradient);
    border: none;
    color: #000;
    padding: 8px 15px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    margin-right: 15px;
    transition: var(--transition);
}

input[type="file"]::file-selector-button:hover {
    opacity: 0.9;
}

/* Select Dropdown Styling */
select option {
    background-color: #1a2035;
    color: var(--text-main);
}

/* Placeholders */
input::placeholder {
    color: var(--text-muted);
}

/* Focus Effects */
input[type="email"]:focus,
input[type="text"]:focus,
input[type="file"]:focus,
select:focus {
    background-color: rgba(255, 255, 255, 0.08) !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3) !important;
    outline: none;
}

/* --- Loading Text --- */
#loading {
    color: var(--accent);
    font-size: 14px;
    margin-bottom: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}

/* --- Signup Button --- */
#signup {
    width: 100%;
    max-width: 400px;
    background: var(--gradient) !important;
    border: none !important;
    color: #000 !important;
    font-weight: 700 !important;
    padding: 15px 20px !important;
    border-radius: 12px !important;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 4px 20px rgba(79, 172, 254, 0.4);
    text-transform: uppercase;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

#signup:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(79, 172, 254, 0.6);
}

/* --- Already Account Link --- */
a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    transition: var(--transition);
    letter-spacing: 0.5px;
}

a:hover {
    color: var(--accent);
    text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
}
    </style>

  <body>
    <input type="file" id="imageUpload" accept="image/*" />
    <!-- <button onclick="uploadimage()" id="btn"> upload image</button> -->
    <b id="loading" style="display: none">Loading.....</b>

    <input type="email" placeholder="Enter Email Address" id="email" />
    <input type="text" placeholder="Enter Password " id="password" />
    <input type="text" placeholder="Enter name " id="name" />

    <button id="signup">SignUp</button>
