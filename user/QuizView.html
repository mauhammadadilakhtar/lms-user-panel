    <style>
     /* =========================================
   🌟 WELCOME DASHBOARD & QUIZ LIST STYLING 🌟
   ========================================= */

:root {
    --bg-color: #0a0e17; 
    --card-bg: #1a2035; 
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent: #00f2fe;   
    --accent2: #4facfe;  
    --gradient: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
    --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    min-height: 100vh;
    padding: 40px;
    background: radial-gradient(circle at top right, #1a2238 0%, var(--bg-color) 60%);
}

/* --- Welcome Dashboard Title --- */
h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 30px;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
    text-align: center;
}

/* --- Quiz List Container --- */
#quizList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

/* --- Dynamic Quiz Cards Styling (Jab aap JavaScript se cards generate karenge) --- */
.quiz-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: var(--shadow-card);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.quiz-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--gradient);
}

.quiz-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px -10px rgba(0, 242, 254, 0.25);
    border-color: rgba(0, 242, 254, 0.2);
}

.quiz-card h3 {
    font-size: 18px;
    color: var(--text-main);
    margin-bottom: 10px;
    font-weight: 700;
}

.quiz-card p {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.5;
}

/* --- Quiz Card Action Button --- */
.quiz-card button, 
.quiz-card a.btn {
    display: inline-block;
    background: var(--gradient);
    color: #000;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.quiz-card button:hover, 
.quiz-card a.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
}

/* --- Responsive Adjustments --- */
@media (max-width: 768px) {
    body {
        padding: 20px;
    }
    h1 {
        font-size: 24px;
    }
    #quizList {
        grid-template-columns: 1fr;
    }
}
    </style>
