3233<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Teachers</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Neon Dashboard CSS -->
   <style>
   /* =========================================
   🌟 COMPLETE NEON DARK DASHBOARD THEME 🌟
   ========================================= */

:root {
    --bg-color: #0a0e17; 
    --sidebar-bg: #111625;
    --card-bg: #1a2035; 
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent: #00f2fe;   
    --accent2: #4facfe;  
    --gradient: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
    --shadow-card: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
    --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    overflow-x: hidden;
    font-size: 14px;
}
/* --- Delete Button Styling --- */
.teacher-card {
    position: relative; /* Zaroori hai taaki delete button absolute position mein theek lagay */
}

.btn-delete {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255, 75, 75, 0.1);
    border: 1px solid rgba(255, 75, 75, 0.3);
    color: #ff4b4b;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 14px;
}

.btn-delete:hover {
    background: #ff4b4b;
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 75, 75, 0.5);
    transform: scale(1.1);
}

/* --- Dashboard Layout --- */
.dashboard {
    display: flex;
    min-height: 100vh;
    background-color: var(--bg-color);
}

/* --- Sidebar --- */
.sidebar {
    width: 270px;
    background: var(--sidebar-bg);
    padding: 30px 20px;
    position: fixed;
    height: 100vh;
    top: 0;
    left: 0;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}

.sidebar .logo {
    font-size: 20px;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 40px;
    padding-left: 10px;
    letter-spacing: 1px;
}

.sidebar .menu {
    list-style: none;
    flex-grow: 1;
}

.sidebar .menu li {
    margin-bottom: 12px;
}

.sidebar .menu li a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 600;
    border-radius: 12px;
    transition: var(--transition);
}

.sidebar .menu li a:hover, 
.sidebar .menu li a.active {
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
    border: 1px solid rgba(0, 242, 254, 0.2);
}

/* --- Main Content Area --- */
.main {
    margin-left: 270px;
    flex-grow: 1;
    padding: 30px;
    background: radial-gradient(circle at top right, #1a2238 0%, var(--bg-color) 60%);
    min-height: 100vh;
}

/* --- Top Bar --- */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    padding: 20px 30px;
    border-radius: 16px;
    margin-bottom: 30px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: var(--shadow-card);
}

.topbar h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    margin: 0;
}

.admin {
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 600;
    border: 1px solid rgba(0, 242, 254, 0.2);
}

/* --- Table Box Container --- */
.table-box {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: var(--shadow-card);
}

.table-box h2 {
    font-size: 18px;
    color: var(--text-main);
    margin-bottom: 20px;
    font-weight: 700;
}

/* --- Custom Styled Table --- */
.table-responsive {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

table th {
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

table td {
    padding: 15px;
    color: var(--text-main);
    font-size: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    vertical-align: middle;
}

table tr:hover {
    background: rgba(255, 255, 255, 0.02);
}

/* Table Avatar & Badge */
.table-avatar {
    width: 45px !important;
    height: 45px !important;
    border-radius: 50% !important;
    object-fit: cover !important;
    border: 2px solid var(--accent);
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
}

.badge-custom {
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid rgba(0, 242, 254, 0.3);
}

/* --- Add Teacher Button --- */
.btn-danger {
    background: var(--gradient) !important;
    border: none !important;
    color: #000 !important;
    font-weight: 700 !important;
    padding: 12px 20px !important;
    border-radius: 12px !important;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
}

.btn-danger:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
}

/* --- Bootstrap Modal Dark Neon Customization --- */
.modal-content {
    background-color: var(--card-bg) !important;
    color: var(--text-main) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 20px !important;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
}

.modal-header {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    padding: 20px 25px !important;
}

.modal-title {
    color: var(--text-main) !important;
    font-weight: 700 !important;
}

.btn-close {
    filter: invert(1) grayscale(100%) brightness(200%) !important;
}

.modal-body {
    padding: 25px !important;
}

.modal-body label {
    color: var(--text-muted) !important;
    font-size: 13px;
}

.modal-body .form-control {
    background-color: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: var(--text-main) !important;
    border-radius: 10px !important;
    padding: 10px 15px !important;
    font-size: 14px;
    transition: var(--transition);
}

.modal-body .form-control::placeholder {
    color: var(--text-muted);
}

.modal-body .form-control:focus {
    background-color: rgba(255, 255, 255, 0.08) !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3) !important;
    outline: none;
}

.modal-footer {
    border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
    padding: 15px 25px !important;
}

.modal-footer .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 10px 20px;
    font-weight: 600;
}

.modal-footer .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
}

.modal-footer .btn-primary {
    background: var(--gradient) !important;
    border: none !important;
    color: #000 !important;
    font-weight: 700 !important;
    padding: 10px 20px !important;
    border-radius: 10px !important;
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
}

.modal-footer .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
}

/* --- Responsive Adjustments --- */
@media (max-width: 992px) {
    .sidebar {
        width: 80px;
        padding: 20px 10px;
    }
    .sidebar .logo, 
    .sidebar .menu span {
        display: none;
    }
    .main {
        margin-left: 80px;
    }
}
/* --- Teachers Grid Layout --- */
.teachers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 25px;
}

/* --- Individual Teacher Card (Image Left, Details Right) --- */
.teacher-card {
    background: rgba(26, 32, 53, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    gap: 20px;
    align-items: center;
    box-shadow: var(--shadow-card);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.teacher-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--gradient);
}

.teacher-card:hover {
    transform: translateY(-5px);
    border-color: rgba(0, 242, 254, 0.3);
    box-shadow: 0 15px 35px -10px rgba(0, 242, 254, 0.2);
}

/* --- Prominent Large Teacher Image --- */
.teacher-img-box {
    flex-shrink: 0;
    width: 110px;
    height: 110px;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid var(--accent);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
}

.teacher-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: var(--transition);
}

.teacher-card:hover .teacher-img-box img {
    transform: scale(1.05);
}

/* --- Teacher Info Details --- */
.teacher-info {
    flex-grow: 1;
}

.teacher-info h3 {
    font-size: 18px;
    color: var(--text-main);
    margin-bottom: 5px;
    font-weight: 700;
}

.teacher-email {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
}

.teacher-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 12px;
}

.teacher-meta strong {
    color: var(--text-main);
}

.teacher-expertise {
    display: inline-block;
}

/* Responsive adjustment for small screens */
@media (max-width: 480px) {
    .teacher-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    .teacher-meta {
        align-items: center;
    }
}
   </style>
</head>
<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">Admin Panel</div>
            <ul class="menu">
                
    <li><a href="./dashboard.html">🏠 Dashboard</a></li>
    <li><a href="./students.html">👨‍🎓 Students</a></li>
    <li><a href="./teacher.html">👨‍🏫 Teachers</a></li>
    <li><a href="./courses.html">📚 Courses</a></li>
    <li><a href="./quiz.html" >💳 Quizs</a></li>
    <li><a href="./report.html">📊 Reports</a></li>
    <li><a href="./Questions.html" class="active">🚪 Questions</a></li>
    <li><a href="./settings.html">⚙️ Settings</a></li>
    <li><a href="./login.html">🚪 Logout</a></li>
    

            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main">

            <!-- Top Bar -->
            <div class="topbar">
                <div>
                    <h1>Teachers List</h1>
                </div>
                <div class="admin">👤 Admin</div>
            </div>

            <!-- Teachers Cards Section -->
            <section class="table-box">
                <div style="text-align: right; margin-bottom: 25px;">
                    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#addTeacherModal">Add New Teacher</button>
                </div>

                <h2>All Teachers Directory</h2>

                <!-- Dynamic Teachers Grid Container -->
                <div id="teachersGrid" class="teachers-grid">
                    <!-- Teacher cards will load here automatically via JavaScript -->
                </div>
            </section>

        </main>

    </div>

    <!-- Add Teacher Modal -->
    <div class="modal fade" id="addTeacherModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="addTeacherModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="addTeacherModalLabel">Add New Teacher</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label">Teacher Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="teacherName" placeholder="Enter name">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label">Email Address</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" id="teacherEmail" placeholder="Enter email">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label">Assigned Course</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="teacherCourse" placeholder="e.g. MERN Stack">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label">Expertise</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="teacherExpertise" placeholder="e.g. React, Node.js">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label">Experience</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="teacherExperience" placeholder="e.g. 5 Years">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-4 col-form-label">Profile Image URL</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="teacherImage" placeholder="Paste image link">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addTeacher()">Save Teacher</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript File -->
    <script src="teacher.js"></script>
</body>
</html>
