    <style>
       /* =========================================
   🌟 QUIZ PAGE & MODAL DARK THEME STYLING 🌟
   ========================================= */

:root {
    --bg-color: #0a0e17; 
    --sidebar-bg: #111625;
    --card-bg: #1a2035; 
    --text-main: #ffffff;
    --text-muted: #8b9bb4;
    --accent: #00f2fe;   
    --accent2: #4facfe;  
    --gradient: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
    --success: #00e676;
    --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    overflow-x: hidden;
    font-size: 14px;
}

.dashboard {
    display: flex;
    min-height: 100vh;
}

/* --- Sidebar --- */
.sidebar {
    width: 270px;
    background: var(--sidebar-bg);
    padding: 30px 20px;
    position: fixed;
    height: 100vh;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 50px;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.menu {
    list-style: none;
}

.menu li {
    margin-bottom: 15px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text-muted);
    padding: 14px 20px;
    border-radius: 12px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.menu a:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 0 15px rgba(79, 172, 254, 0.2);
    transform: translateX(5px);
}

.menu .active {
    background: var(--gradient);
    color: #000 !important; 
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
}

/* --- Main Content --- */
.main {
    margin-left: 270px;
    width: calc(100% - 270px);
    padding: 40px;
    background: radial-gradient(circle at top right, #1a2238 0%, var(--bg-color) 60%);
}

/* --- Topbar --- */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 40px;
    padding: 20px 30px;
    background: rgba(26, 32, 53, 0.6);
    backdrop-filter: blur(10px); 
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: var(--shadow-card);
}

.topbar h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-main);
}

.admin {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 25px;
    border-radius: 50px; 
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-main);
}

.admin::before {
    content: '';
    width: 10px;
    height: 10px;
    background: var(--success);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--success);
}

/* --- Table Section & Add Quiz Button --- */
.table-box {
    background: var(--card-bg);
    padding: 30px;
    border-radius: 20px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(255, 255, 255, 0.03);
}

.table-box h2 {
    font-size: 22px;
    margin-bottom: 25px;
    color: var(--text-main);
}

.table-box .btn-danger {
    background: var(--gradient) !important;
    border: none !important;
    color: #000 !important;
    font-weight: 700 !important;
    padding: 12px 24px !important;
    border-radius: 12px !important;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
}

.table-box .btn-danger:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
    opacity: 0.9;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 15px; 
    margin-top: -15px;
}

th {
    text-align: left;
    color: var(--text-muted);
    font-size: 12px;
    padding: 15px 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 2px solid rgba(255,255,255,0.05);
}

td {
    padding: 18px 15px;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.03);
    color: var(--text-main);
}

td:first-child {
    border-left: 1px solid rgba(255,255,255,0.03);
    border-radius: 10px 0 0 10px;
}

td:last-child {
    border-right: 1px solid rgba(255,255,255,0.03);
    border-radius: 0 10px 10px 0;
}

tr {
    transition: var(--transition);
}

tr:hover td {
    background: rgba(255, 255, 255, 0.06);
    transform: scale(1.01);
}

/* --- Bootstrap Dark Modal Styling --- */
.modal-content {
    background-color: var(--card-bg) !important;
    color: var(--text-main) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 20px !important;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7) !important;
}

.modal-header {
    border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
    padding: 20px 25px !important;
}

.modal-footer {
    border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
    padding: 20px 25px !important;
}

.modal-title {
    color: var(--text-main) !important;
    font-weight: 700 !important;
}

.modal-header .btn-close {
    filter: invert(1) grayscale(100%) brightness(200%);
}

.modal-body {
    padding: 25px !important;
}

.modal-body .form-control {
    background-color: rgba(255, 255, 255, 0.03) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: var(--text-main) !important;
    border-radius: 10px !important;
    padding: 12px 15px !important;
    transition: var(--transition);
}

.modal-body .form-control:focus {
    background-color: rgba(255, 255, 255, 0.05) !important;
    border-color: var(--accent) !important;
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.2) !important;
    color: var(--text-main) !important;
}

.modal-body .col-form-label {
    color: var(--text-muted) !important;
    font-weight: 600;
    font-size: 13px;
}

.modal-footer .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    border-radius: 10px;
    padding: 10px 20px;
    font-weight: 600;
    transition: var(--transition);
}

.modal-footer .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
}

.modal-footer .btn-primary {
    background: var(--gradient) !important;
    border: none !important;
    color: #000 !important;
    font-weight: 700 !important;
    border-radius: 10px !important;
    padding: 10px 22px !important;
    transition: var(--transition);
    box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
}

.modal-footer .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
}

/* --- Responsive Layout for Quiz Page --- */
@media (max-width: 1000px) {
    .sidebar {
        width: 80px;
        padding: 30px 10px;
    }
    .logo {
        font-size: 12px;
        margin-bottom: 30px;
    }
    .menu a span {
        display: none; 
    }
    .menu a {
        justify-content: center;
        padding: 15px;
    }
    .main {
        margin-left: 80px;
        width: calc(100% - 80px);
        padding: 20px;
    }
}

@media (max-width: 768px) {
    .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }
    .table-box {
        overflow-x: auto;
    }
    table {
        min-width: 750px; /* Quiz table mein columns zyada hain isliye min-width barha di hai */
    }
}

@media (max-width: 576px) {
    .modal-dialog {
        margin: 15px;
        max-width: calc(100% - 30px);
    }
    .modal-body .row {
        flex-direction: column;
    }
    .modal-body .col-sm-4,
    .modal-body .col-sm-7 {
        width: 100% !important;
        max-width: 100% !important;
    }
    .modal-footer {
        flex-direction: column-reverse;
        gap: 10px;
    }
    .modal-footer .btn {
        width: 100%;
        margin: 0 !important;
    }
}
    </style>
